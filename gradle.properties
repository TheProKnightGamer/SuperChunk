# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Config-cache OFF: ModDevGradle + heavy mixin codegen has been flaky with it on.
org.gradle.configuration-cache=false

# Parchment (human-readable param names)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.215
loader_version_range=[1,)

## Mod properties
mod_id=superchunk
mod_name=SuperChunk
# Bundled sources are LGPL-3.0 (C2ME/ScalableLux/Noisium/Lithium) -> the merged work is LGPL-3.0-only.
mod_license=LGPL-3.0-only
mod_version=0.1.0
mod_group_id=dev.superchunk
mod_authors=TheProKnightGamer (merge of C2ME, ScalableLux, NoisiumForked, Lithium)
mod_description=Unified worldgen + chunk performance super-mod: merged sources of C2ME (threaded chunk system), ScalableLux (Starlight lighting), NoisiumForked (worldgen noise), and Lithium (game logic).
