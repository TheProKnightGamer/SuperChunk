# SuperChunk — unified configuration (single source of truth).
# SuperChunk applies these to the underlying engines at load:
#   gpu.*      -> the OpenCL worldgen offload (GpuConfig)
#   c2me.*     -> -Dc2me.base.config.override.<key> (overrides c2me.toml)
#   lithium.*  -> config/lithium.properties as mixin.<key>
#   lighting.* -> scalablelux.properties
#   player.*   -> read directly by SuperChunk at runtime (no write-through)
# Edit THIS file; the per-engine files are written from it and may be overwritten.
# (On first run, any legacy superchunk-gpu.properties / lithium.properties are migrated in.)

# ===== GPU / OpenCL worldgen offload (master switch + precision + features) =====
gpu.enabled=false
gpu.platformIndex=-1
gpu.deviceIndex=-1
gpu.desiredFp=fp64
gpu.coalesce=true
gpu.fuseInterpolated=true
gpu.asyncReadback=true
gpu.offloadBiome=true
gpu.batchChunks=false
gpu.batchLimit=32
gpu.batchWindowMicros=500
# mergeKernels: merge a router's DF kernels into one program (headers compiled once). Bit-identical
# but a measured cold-compile REGRESSION on real worldgen (clBuildProgram is super-linear in program
# size). Leave false unless your dimension has only tiny density functions.
gpu.mergeKernels=false
gpu.latticeCoords=true
gpu.mappedBuffers=true
gpu.profile=false
gpu.selftest.noise=false
gpu.selftest.dfc=false
gpu.selftest.gpu_parity=false

# ===== C2ME multithreaded chunk gen (applied as -Dc2me.base.config.override.<key>) =====
# 'default' = C2ME auto-sizes min(cpu/1.3, heap-based); set e.g. 21 to use more cores (watch heap/GC).
c2me.globalExecutorParallelism=default

# ===== Lithium (the =false ones overlap C2ME and MUST stay disabled) =====
lithium.gen.cached_generator_settings=false
lithium.chunk.serialization=false
# true since 2026-08-05: does NOT overlap C2ME. Removes vanilla's ThreadingDetector
# ReentrantLock+Semaphore from every PalettedContainer get/set (~3% of worldgen CPU).
lithium.chunk.no_locking=true
lithium.world.tick_scheduler=false
lithium.world.chunk_access=false

# ===== Lighting (ScalableLux; externally managed by C2ME, effectively inert) =====
lighting.parallelism=-1

# ===== Chunky pregen: how many chunks Chunky keeps IN FLIGHT =====
# Chunky's generation loop is a semaphore of this many permits, so it hard-caps the whole
# pipeline (in-flight = throughput x per-chunk latency). Chunky's own default is 50, sized for
# vanilla's synchronous chunk pipeline rather than this mod's much deeper async one.
# 'auto' = 192 per GB of max heap, clamped to 256..3072. 'default' = don't touch Chunky.
# A plain number is used as-is. An explicit -Dchunky.maxWorkingCount always wins.
# Measured on a 16 GB heap: 3072 best, 768 ~6% slower, 6144 slower again.
pregen.chunkyWorkingCount=auto

# ===== Full-throttle chunk loading ("no radius shrink"). false = vanilla behavior. =====
# When true, SuperChunk lifts the SERVER-side self-throttles that make the effective loaded
# ring shrink around a fast-moving player:
#   - vanilla PlayerChunkSender: the per-tick chunk-send budget is pinned to chunksPerTick
#     (vanilla max 64) instead of shrinking to the client-reported desired batch size on slow
#     acks; the post-drain quota slow-start is neutralized; maxUnackedBatches widens the
#     in-flight batch window (vanilla 10; raise-only).
#   - C2ME notickvd: the concurrent chunk-load cap is raised to at least
#     noTickVdMaxConcurrentLoads (C2ME default: executor parallelism + 1).
# HONESTY NOTE: server-side lifts only. A slow client still decodes, renders and acks chunk
# batches at its own pace; the server merely stops throttling itself below what the pipeline
# can produce.
player.fullSpeedLoading=false
player.fullSpeedLoading.chunksPerTick=64
player.fullSpeedLoading.maxUnackedBatches=10
player.fullSpeedLoading.noTickVdMaxConcurrentLoads=128
