# SuperChunk configuration (single source of truth).
#
# SuperChunk passes these settings on to the engines it contains:
#   gpu.*      -> the OpenCL GPU worldgen offload
#   c2me.*     -> C2ME, as -Dc2me.base.config.override.<key> (wins over c2me.toml)
#   lithium.*  -> config/lithium.properties, as mixin.<key>
#   lighting.* -> config/scalablelux.properties
#   pregen.*   -> Chunky, as the -Dchunky.maxWorkingCount system property
#   player.*   -> read by SuperChunk on the server
#   client.*   -> read by SuperChunk on the client
#   logging.*  -> SuperChunk's own log output
# Edit this file, not the per-engine files: those are rewritten from it at startup.
# Changes take effect after a restart. Use the values each description lists.
# superchunk-config-format: 3

# ===== GPU worldgen offload (OpenCL) =====
# Moves terrain density math to the graphics card. Off by default. It needs an OpenCL GPU with
# double-precision (fp64) support; without one, SuperChunk uses the CPU.

# Master switch for GPU worldgen. true = compute terrain noise on the GPU; false = CPU only. If
# no usable device is found, the server logs why and uses the CPU.
# Default: false
gpu.enabled=false

# OpenCL platform (driver) to use, by its number in the startup log's 'Platform[n]' lines. -1 =
# choose automatically.
# Default: -1
gpu.platformIndex=-1

# GPU within that platform, by its number in the startup log. -1 = choose automatically.
# Default: -1
gpu.deviceIndex=-1

# Precision of the GPU terrain math. fp64 = double precision, terrain identical to vanilla;
# devices without fp64 are not used. auto = fp64 if the device supports it, otherwise fp32
# (terrain may differ slightly from vanilla). fp32 = always single precision (testing only).
# Default: fp64
gpu.desiredFp=fp64

# Compute each density function for a whole chunk in one GPU call instead of one call per
# column. Same results, far fewer GPU calls. Needed by fuseInterpolated, asyncReadback and
# batchChunks.
# Default: true
gpu.coalesce=true

# Compute all of a chunk's interpolated density grids in a single GPU call. Same results. Needs
# coalesce.
# Default: true
gpu.fuseInterpolated=true

# Start a chunk's GPU work early and collect the results later, so the worker thread keeps doing
# CPU work meanwhile. Same results. Needs fuseInterpolated.
# Default: true
gpu.asyncReadback=true

# Also compute biome climate noise on the GPU. Biomes are identical either way. Off because the
# GPU is usually the busier side: this measured 11-22% slower overall. Try it only if your GPU
# is mostly idle.
# Default: false
gpu.offloadBiome=false

# Combine several chunks into one GPU call and free the worker thread while it runs. This is the
# fast path and is required for GPU block decisions (see decideFp32). false = one GPU call per
# chunk.
# Default: true
gpu.batchChunks=true

# Maximum number of chunks combined into one GPU call (1 or more).
# Default: 32
gpu.batchLimit=32

# How long, in microseconds, a chunk waits for others to join its batch before the batch is sent
# anyway (0 or more). Longer = bigger batches but more waiting.
# Default: 500
gpu.batchWindowMicros=500

# How many batches may be on the GPU at the same time (1-16). 2 measured best on an i7-14700K
# with an RTX 3070; a weak CPU with a strong GPU may gain from 3 or 4.
# Default: 2
gpu.batchPipelineDepth=2

# Compile all density functions into a single OpenCL program. Same results, but the first-time
# compile becomes far slower for normal worlds. Leave false.
# Default: false
gpu.mergeKernels=false

# Also send the small terrain-height probes used for structure placement to the GPU. Measured
# 18% slower, because each probe waits for its own GPU round trip. Leave false.
# Default: false
gpu.subLatticeGpu=false

# Precision of the GPU's per-block decisions (stone, air, water, lava, ore veins); the density
# grids stay fp64. true = single precision, faster; very rarely a block can differ from vanilla
# (one stone/air difference in 143 million blocks on one tested seed). false = double precision,
# no known differences. Falls back to fp64 automatically if the fp32 program fails to build. To
# keep block decisions on the CPU entirely, start the server with
# -Dsuperchunk.gpu.compactIds=off.
# Default: true
gpu.decideFp32=true

# Allow fused multiply-add in the fp32 decision program. Experimental: no speed gain was
# measured on an RTX 3070.
# Default: false
gpu.decideFmaContract=false

# Single precision for the GPU climate program (only used with offloadBiome=true). Experimental:
# on vanilla terrain a startup check rejects it and keeps fp64. Only useful for datapacks whose
# climate noise is not domain-warped.
# Default: false
gpu.climateFp32=false

# Generate grid coordinates on the GPU instead of uploading them. Same results. Needed by
# coalesce; leave true.
# Default: true
gpu.latticeCoords=true

# Use pinned host memory for GPU transfers (zero-copy on integrated GPUs, faster copies on
# discrete ones). Leave true unless a driver has problems with it.
# Default: true
gpu.mappedBuffers=true

# Record GPU timings (upload, kernel, readback) and log a breakdown when the server stops.
# Diagnostics; small overhead.
# Default: false
gpu.profile=false

# Diagnostics: at startup, compare GPU noise with the CPU implementation and log the result.
# Default: false
gpu.selftest.noise=false

# Diagnostics: at startup, compare the GPU density-function compiler's output with the CPU and
# log the result.
# Default: false
gpu.selftest.dfc=false

# Diagnostics: at startup, compare GPU density values with vanilla's. On fp64 devices they are
# expected to match exactly.
# Default: false
gpu.selftest.gpu_parity=false

# ===== C2ME multithreaded chunk system =====
# Each c2me.<key> is passed to C2ME as -Dc2me.base.config.override.<key> and takes precedence
# over config/c2me.toml. 'default' = C2ME's own default applies. Any other C2ME option can be
# added here as c2me.<key>=<value>. A -D option given on the command line always wins.

# Number of worldgen worker threads. default = chosen by C2ME from CPU cores and heap size (the
# startup log says when the heap is the limit). A number sets it directly; each extra thread
# needs roughly 0.6 GB more heap.
# Default: default (C2ME's own default applies)
c2me.globalExecutorParallelism=default

# Load and send chunks beyond the simulation distance without ticking them, so the view distance
# can be larger than the simulation distance cheaply. C2ME default: true.
# Default: default (C2ME's own default applies)
c2me.noTickViewDistance.enabled=default

# How many of those no-tick chunk loads run at once. Lower = lower latency, higher = faster
# loading. C2ME default: worker threads + 1 (player.fullSpeedLoading can raise it).
# Default: default (C2ME's own default applies)
c2me.noTickViewDistance.maxConcurrentChunkLoads=default

# Let clients request render distances above 127 chunks through C2ME's extended protocol, which
# SuperChunk clients use automatically. C2ME default: true.
# Default: default (C2ME's own default applies)
c2me.noTickViewDistance.enableExtRenderDistanceProtocol=default

# How autosave runs. ENHANCED = when the server has spare time after a tick; VANILLA = every
# tick during ticking; PERIODIC = every 6000 ticks (the pre-1.18 behavior). C2ME default:
# ENHANCED.
# Default: default (C2ME's own default applies)
c2me.generalOptimizations.autoSave.mode=default

# Interval, in nanoseconds, for running chunk tasks in the middle of a server tick. This speeds
# up chunk loading while the server is busy, but can raise tick time while chunks load. -1
# disables it. C2ME default: 100000 (0.1 ms). Leave it unless you know you need it.
# Default: default (C2ME's own default applies)
c2me.generalOptimizations.midTickChunkTasksInterval=default

# Experimental C2ME chunk saver with fewer memory allocations. It changes how chunks are written
# to disk; C2ME asks for regular world backups if you use it, and turns it off automatically
# when Architectury is installed. C2ME default: false.
# Default: default (C2ME's own default applies)
c2me.ioSystem.gcFreeChunkSerializer=default

# If a chunk fails to load, regenerate it from scratch instead of failing. Whatever was built in
# that chunk is lost. C2ME default: false.
# Default: default (C2ME's own default applies)
c2me.chunkSystem.recoverFromErrors=default

# Unload unused chunks aggressively to save memory. Only has an effect together with
# c2me.chunkSystem.useLegacyScheduling=false (C2ME's default is true). C2ME default: false.
# Default: default (C2ME's own default applies)
c2me.chunkSystem.lowMemoryMode=default

# Work around MC-276863, where mushrooms can briefly appear in chunks that are not
# post-processed yet. On because player.sendAtChunkSending shows such chunks to players earlier.
# No other effect on worldgen; false = vanilla behavior.
# Default: true
c2me.chunkSystem.suppressGhostMushrooms=true

# ===== Client render distance =====

# Highest render distance the client's video-settings slider allows (32-512; vanilla is 32).
# This only sets the slider limit: the server still decides how far it sends. On joining a
# server, a distance above 32 is requested through C2ME's extended protocol (the only way above
# 127), so a slider change takes effect the next time you join. Client memory for chunks grows
# with the square of the distance (64 uses about 4x as much as 32). Read by clients only.
# Default: 64
client.maxRenderDistance=64

# ===== Lithium =====
# Written to config/lithium.properties as mixin.<rule>. The four rules set to false below
# overlap C2ME's chunk system and are always forced off, whatever this file says. Other Lithium
# rules can be added here as lithium.<rule>=true|false. When Skein is installed, SuperChunk also
# turns off Lithium caches that assume one ticking thread per world.

# Overlaps C2ME's world generation; always forced to false.
# Default: false
lithium.gen.cached_generator_settings=false

# Overlaps C2ME's chunk saving; always forced to false.
# Default: false
lithium.chunk.serialization=false

# Remove vanilla's concurrent-access check, a lock taken on every block write in a chunk section
# (about 3% of worldgen CPU). Safe alongside C2ME.
# Default: true
lithium.chunk.no_locking=true

# Overlaps C2ME's chunk system; always forced to false.
# Default: false
lithium.world.tick_scheduler=false

# Overlaps C2ME's chunk system; always forced to false.
# Default: false
lithium.world.chunk_access=false

# ===== Lighting (ScalableLux) =====

# Threads for ScalableLux lighting (-1 = automatic). Currently has no effect, because C2ME runs
# the lighting itself. Written to scalablelux.properties for completeness.
# Default: -1
lighting.parallelism=-1

# ===== Chunky pre-generation =====

# How many chunks Chunky keeps generating at once. Chunky's own default of 50 holds this mod's
# pipeline back badly. auto = 192 per GB of maximum heap, between 256 and 3072. default = leave
# Chunky's setting alone. A number is used as given. -Dchunky.maxWorkingCount on the command
# line always wins. Measured with a 16 GB heap: 3072 was fastest, 768 about 6% slower, 6144
# slower again.
# Default: auto
pregen.chunkyWorkingCount=auto

# ===== Fast chunk loading for moving players =====
# Server-side only: a slow client still receives, builds and acknowledges chunks at its own
# pace.

# true = stop the server from throttling chunk sending to fast-moving players (see the three
# options below). false = vanilla behavior.
# Default: false
player.fullSpeedLoading=false

# With fullSpeedLoading on: chunks sent to each player per tick, instead of the smaller rate a
# busy client asks for (1-512; vanilla never sends more than 64).
# Default: 64
player.fullSpeedLoading.chunksPerTick=64

# With fullSpeedLoading on: chunk batches that may be waiting for a client's acknowledgement (up
# to 1000). Vanilla's 10 is the minimum; lower values are ignored.
# Default: 10
player.fullSpeedLoading.maxUnackedBatches=10

# With fullSpeedLoading on: minimum number of no-tick chunk loads that may run at once
# (1-65536). It raises c2me.noTickViewDistance.maxConcurrentChunkLoads and never lowers it.
# Default: 128
player.fullSpeedLoading.noTickVdMaxConcurrentLoads=128

# ===== Chunk delivery to players =====

# Send chunks to players as soon as they are ready to be sent, instead of waiting until they
# tick. Without it, when the view distance is larger than the simulation distance, the outer
# chunks never arrive. Recommended: true.
# Default: true
player.sendAtChunkSending=true

# Do chunk work near players (within view distance + 8 chunks) before other chunk work. It only
# reorders existing work; nothing extra is generated.
# Default: false
player.priorityBias=false

# Log a [player-latency] line every second with per-player chunk-delivery statistics.
# Diagnostics; shown only when logging.verbose=true.
# Default: false
player.latencyMetrics=false

# ===== Predictive generation ahead of fast-moving players =====
# Generates the chunks along the path a fast player is heading, instead of enlarging the whole
# loaded area. Affects real players only; no effect on pre-generation.

# Master switch. false = no effect at all.
# Default: true
player.predictiveGen=true

# How far ahead to predict, in seconds of travel (0.5-30).
# Default: 4
player.predictiveGen.lookaheadSeconds=4

# Most chunks predicted per player at a time, nearest first (1-1024).
# Default: 64
player.predictiveGen.maxPredictedChunks=64

# Horizontal speed, in blocks per second, at which prediction starts (0.5-500).
# Default: 8
player.predictiveGen.minSpeedBps=8

# Most predicted chunk loads in progress at once (1-256). Separate from the no-tick loader's own
# limit.
# Default: 8
player.predictiveGen.maxConcurrentPredictedLoads=8

# Width of the predicted path, in chunks (1-15, and never wider than the view distance).
# Default: 5
player.predictiveGen.corridorWidthChunks=5

# How often the predicted path is recalculated, in ticks (1-100).
# Default: 10
player.predictiveGen.recomputeIntervalTicks=10

# For the metrics: a predicted chunk that enters the player's view within this many seconds
# counts as a hit (1-120).
# Default: 10
player.predictiveGen.hitWindowSeconds=10

# Log a [predictive-gen] line every second with prediction counts and the hit rate. Diagnostics;
# shown only when logging.verbose=true.
# Default: false
player.predictiveGen.logMetrics=false

# ===== Logging =====

# false = SuperChunk writes only warnings and errors to the log. true = also its informational
# lines: startup summaries, feature status, and the metrics and verify diagnostics you enable.
# Turn on when reporting a problem.
# Default: false
logging.verbose=false
