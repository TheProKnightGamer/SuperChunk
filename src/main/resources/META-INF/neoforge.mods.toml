modLoader = "javafml"
loaderVersion = "[1,)"
license = "LGPL-3.0-only"
# TODO(unverified): no public repo/issue tracker is known for this project (source lives locally,
# not on GitHub). Replace with the real URL if/when one exists, or drop this line — issueTrackerURL
# is optional. Left as a best-guess placeholder for now.
issueTrackerURL = "https://github.com/TheProKnightGamer/SuperChunk/issues"

[[mods]]
modId = "superchunk"
version = "0.3.0"
displayName = "SuperChunk"
authors = "TheProKnightGamer (merge of C2ME, ScalableLux, NoisiumForked, Lithium)"
description = '''
Unified worldgen + chunk-performance super-mod. A from-source merge of:
  - C2ME        (multithreaded chunk generation / IO / loading)
  - ScalableLux (Starlight-fork lighting engine, parallel light updates)
  - NoisiumForked (worldgen noise / biome / blockstate placement)
  - Lithium     (general game-logic optimization)
'''

# Mixin configs. One per integrated domain so they can be staged/toggled.
[[mixins]]
config = "superchunk.mixins.json"

[[mixins]]
config = "scalablelux.mixins.json"

# Optional-mod interop hooks (Distant Horizons' own batch generator). "required": false inside the
# config: its targets are DH classes, so with DH absent — or with a DH version that renamed them —
# nothing resolves and nothing applies. DhMixinPlugin additionally gates on the DH mod id.
[[mixins]]
config = "superchunk-dh.mixins.json"

# Renamed from lithium.mixins.json / lithium-neoforge.mixins.json to avoid a fatal
# "Decoration with key fabric-modId already exists" clash with a STANDALONE Lithium install
# (which ships configs under those exact original names). The mixin package / class lists,
# the 'plugin', and the 'refmap' inside each config are unchanged (only the FILE NAME + these
# two registrations change; the plugin still hardcodes getRefMapperConfig()="lithium.refmap.json").
[[mixins]]
config = "superchunk-lithium.mixins.json"

[[mixins]]
config = "superchunk-lithium-neoforge.mixins.json"

[[mixins]]
config = "vmp.mixins.json"

[[mixins]]
config = "noisium.mixins.json"

[[mixins]]
config = "c2me.mixins.json"

[[mixins]]
config = "c2me-base.mixins.json"

[[mixins]]
config = "c2me-opts-allocs.mixins.json"

[[mixins]]
config = "c2me-opts-math.mixins.json"

[[mixins]]
config = "c2me-opts-worldgen-general.mixins.json"

[[mixins]]
config = "c2me-opts-worldgen-vanilla.mixins.json"

[[mixins]]
config = "c2me-opts-chunkio.mixins.json"

[[mixins]]
config = "c2me-opts-scheduling.mixins.json"

[[mixins]]
config = "c2me-opts-dfc.mixins.json"

[[mixins]]
config = "c2me-server-utils.mixins.json"

[[mixins]]
config = "c2me-threading-lighting.mixins.json"

[[mixins]]
config = "c2me-fixes-chunkio-threading-issues.mixins.json"

[[mixins]]
config = "c2me-fixes-general-threading-issues.mixins.json"

[[mixins]]
config = "c2me-fixes-worldgen-vanilla-bugs.mixins.json"

[[mixins]]
config = "c2me-fixes-worldgen-threading-issues.mixins.json"

[[mixins]]
config = "c2me-rewrites-chunk-system.mixins.json"

[[mixins]]
config = "c2me-rewrites-chunkio.mixins.json"

[[mixins]]
config = "c2me-notickvd.mixins.json"

[[mixins]]
config = "c2me-rewrites-chunk-serializer.mixins.json"

# opts-natives-math: native-FFI (java.lang.foreign, Java 22) world-gen acceleration.
# UNPORTED on this Java 21 toolchain (revivable via the official C2ME-NeoForge recipe: a
# separate Java-22 compilation unit + vendored .so/.dll natives, runtime-gated for Java 21 —
# note upstream defaults nativeAcceleration.enabled=false anyway). The empty mixin list keeps
# the config valid; a stub ModuleEntryPoint (enabled=false) makes ModuleMixinPlugin log a
# clean "Disabling" INFO instead of a ClassNotFoundException WARN stack trace every launch.
[[mixins]]
config = "c2me-opts-natives-math.mixins.json"

# Optional load-ORDER pin (NOT a hard dependency): when a standalone Lithium is present, force
# SuperChunk to sort BEFORE it. This makes SuperChunk's mixin configs register — and therefore
# SuperChunkMixinPlugin.onLoad() run its config write-through (config/lithium.properties, incl.
# the five C2ME-overlap safety pins) — BEFORE standalone Lithium's LithiumMixinPlugin.onLoad()
# reads that file. type="optional" so this is inert (no error) when Lithium is absent.
[[dependencies.superchunk]]
modId = "lithium"
type = "optional"
ordering = "BEFORE"
side = "BOTH"

# ---------------------------------------------------------------------------------------------
# HARD INCOMPATIBILITIES
#
# A mod cannot disable another mod at runtime — NeoForge has no such API, and the mod list is
# resolved long before we get control. What it DOES support is refusing to launch: type =
# "incompatible" stops mod loading with an error screen naming both mods and the reason below.
# That is the right trade here, because the alternative is not "it works a bit worse" — it is a
# confusing NPE mid-worldgen whose stack names SuperChunk classes.
#
# Bar for adding an entry: a REPRODUCED failure with a known mechanism, written up in
# compatibility.txt. Do not list mods on suspicion — an entry here bricks the launch for anyone
# who has that mod, so a false positive is worse than the bug. Where the conflict is ours to
# yield instead, stand our own feature down (see compat/StructureLayoutOptimizerCompat,
# compat/ByePregenCompat, the bundled-Lithium stand-down) rather than blocking the other mod.
# ---------------------------------------------------------------------------------------------

# Better Chunk Loading calls ChunkHolder.addSaveDependency from a whenComplete hook on the chunk
# future. C2ME's chunk-system rewrite deliberately nulls vanilla's ChunkHolder futures (saveSync
# et al) in chunksystem.mixin.MixinChunkHolder#failFastIncompatibility — a tripwire so that mods
# reaching for vanilla chunk-holder state fail loudly instead of operating on state the rewritten
# chunk system no longer honours. Result: NPE at MinecraftServer.setInitialSpawn, so a new world
# dies before it exists and an existing one dies on the next chunk load. Not fixable from our
# side — the two are competing implementations of the same subsystem, and the NPE is C2ME's
# intended failure mode. Inherited verbatim from upstream C2ME, so plain C2ME fails the same way.
# Full write-up: compatibility.txt, INCOMPATIBLE section.
[[dependencies.superchunk]]
modId = "betterchunkloading"
type = "incompatible"
versionRange = "*"
reason = "betterchunkloading breaks superchunks optimized chunk loading."
ordering = "NONE"
side = "BOTH"

[[dependencies.superchunk]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.superchunk]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1]"
ordering = "NONE"
side = "BOTH"
