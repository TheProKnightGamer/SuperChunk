# No new AT lines required. All targets (CompoundTag/ListTag/ResourceLocation/Util/
# OreFeature/MaterialRuleList/SurfaceRules.Context/SequenceRule/SequenceRuleSource) are
# reached via @Shadow/@Overwrite; SurfaceRules inner classes already widened by C2ME base.
# ASMTransformerNbtOpsMapBuilderFastUtilMap + asm.ASMTargets DROPPED (Fabric-only
# intermediary MappingResolver has no NeoForge equivalent). object_pooling_caching.
# MixinConfiguredFeature DROPPED (matches upstream NeoForge port patch 0010).

# ===== C2ME opts-math =====
# No new AT lines required (NoiseChunk/ImprovedNoise/PerlinNoise/ChunkPos via @Shadow/@Overwrite).

# ===== C2ME opts-worldgen-general =====
# No new AT lines required. LegacyRandomSource.LegacyPositionalRandomFactory + the random
# ctor redirect targets are public; SingleThreadedRandomSource/XoroshiroRandomSource public.

# ===== C2ME opts-worldgen-vanilla =====
# No new AT lines required. Aquifer$NoiseBasedAquifer is public; Aquifer$FluidStatus.{fluidLevel,
# fluidType} already widened above; Beardifier/Beardifier$Rigid/TheEndBiomeSource/Block public;
# SurfaceRules.Context already widened by C2ME base. All member access via @Shadow.

# ===== C2ME fixes-worldgen-threading-issues =====
# OceanMonumentPieces$RoomDefinition (Yarn OceanMonumentGenerator$PieceSetting) is a
# package-private static class. MixinOceanMonumentGeneratorBase/PieceSetting reference the
# type in @Shadow/@Mixin, so it must be public. (MonumentBuilding / WoodlandMansionPieces
# SimpleGrid+MansionGrid are already public above.) All other targets (structure piece bool
# flags, StructureCheck/StructureTemplate/StructurePlaceSettings/StructureStart fields,
# Transformation#ensureDecomposed, OctahedralGroup, Level#thread) reached via @Shadow.
