# ===== C2ME opts-dfc =====
# Yarn DensityFunctionTypes.UnaryOperation (abs/square/cube/half_negative/quarter_negative/squeeze)
# maps to Mojmap DensityFunctions$Mapped (a package-private record) + its package-private Type enum.
# McToAst pattern-matches on Mapped and reads its public record accessors type()/input(), so both
# the class and the inner Type enum must be made public. (All other DensityFunctions$* inners used
# by this module -- TwoArgumentSimpleFunction, HolderHolder, MarkerOrMarked, Marker(+Type), Noise,
# ShiftedNoise, Shift/ShiftA/ShiftB, Clamp, Constant, BlendDensity, BlendAlpha, BlendOffset,
# RangeChoice, WeirdScaledSampler(+RarityValueMapper), YClampedGradient, Spline(+Point/Coordinate)
# -- are already public in vanilla or widened by c2me-base. NoiseChunk$* cache inners
# (Cache2D/CacheOnce/CacheAllInCell/NoiseInterpolator/FlatCache/BlendAlpha/BlendOffset) are
# referenced only by mixins/McToAst and are already public / widened by c2me-base.)
